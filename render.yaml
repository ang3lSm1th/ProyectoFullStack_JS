services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: bash scripts/render-api-build.sh
    startCommand: pnpm --filter @portfolio/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
